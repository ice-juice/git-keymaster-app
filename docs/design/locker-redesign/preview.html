&lt;div id=&quot;locker-redesign&quot;&gt;
  &lt;div class=&quot;viz-carousel&quot; aria-label=&quot;寄存柜设计方向&quot; data-previous-label=&quot;上一个方案&quot; data-next-label=&quot;下一个方案&quot;&gt;
    &lt;section data-variant=&quot;管理工作台 · 推荐&quot; aria-label=&quot;管理工作台方案&quot;&gt;&lt;div class=&quot;lk-stage&quot;&gt;&lt;div class=&quot;lk-app&quot; data-design=&quot;workbench&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section data-variant=&quot;快捷交接&quot; aria-label=&quot;快捷交接方案&quot; hidden&gt;&lt;div class=&quot;lk-stage&quot;&gt;&lt;div class=&quot;lk-app&quot; data-design=&quot;quick&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
const root=document.getElementById(&#x27;locker-redesign&#x27;);
const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const icon=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const button=(label,act,style=&#x27;&#x27;,ico=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; class=&quot;lk-button cursor-interaction ${style}&quot; data-act=&quot;${act}&quot;&gt;${ico?icon(ico):&#x27;&#x27;}${label}&lt;/button&gt;`;
const samples=[
 {id:1,name:&#x27;项目交接说明.pdf&#x27;,size:&#x27;2.4 MiB&#x27;,type:&#x27;file-text&#x27;,usage:&#x27;share&#x27;,time:&#x27;18 小时后到期&#x27;,left:2,total:3,state:&#x27;active&#x27;},
 {id:2,name:&#x27;设计源文件.zip&#x27;,size:&#x27;18.6 MiB&#x27;,type:&#x27;archive&#x27;,usage:&#x27;self&#x27;,time:&#x27;6 天后到期&#x27;,left:1,total:1,state:&#x27;active&#x27;},
 {id:3,name:&#x27;发布素材包.zip&#x27;,size:&#x27;8.4 MiB&#x27;,type:&#x27;archive&#x27;,usage:&#x27;share&#x27;,time:&#x27;23 小时后到期&#x27;,left:1,total:1,state:&#x27;shareFailed&#x27;},
 {id:4,name:&#x27;临时校验文件.txt&#x27;,size:&#x27;12 KiB&#x27;,type:&#x27;file-text&#x27;,usage:&#x27;self&#x27;,time:&#x27;15 分钟前到期&#x27;,left:1,total:1,state:&#x27;expired&#x27;}
];
root.querySelectorAll(&#x27;.lk-app&#x27;).forEach(app=&gt;{
 const quick=app.dataset.design===&#x27;quick&#x27;;
 const s={screen:&#x27;home&#x27;,configured:!quick,items:quick?[]:structuredClone(samples),filter:&#x27;active&#x27;,q:&#x27;&#x27;,selected:null,purpose:&#x27;self&#x27;,ttl:&#x27;24&#x27;,pulls:&#x27;1&#x27;,picked:false,putName:&#x27;交接资料.zip&#x27;,progress:0,receiveType:&#x27;self&#x27;,code:&#x27;&#x27;,link:&#x27;&#x27;,target:&#x27;local&#x27;,queried:false,error:&#x27;&#x27;,toast:&#x27;&#x27;,confirm:&#x27;&#x27;,detail:1,receiveItem:structuredClone(samples[0]),receivedRemaining:1};
 let toastTimer;
 const link=(label,act,extra=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; class=&quot;lk-link cursor-interaction ${extra}&quot; data-act=&quot;${act}&quot;&gt;${label}&lt;/button&gt;`;
 const back=()=&gt;`&lt;div class=&quot;lk-task-head&quot;&gt;${link(&#x27;← 返回寄存柜&#x27;,&#x27;home&#x27;)}&lt;span&gt;/ ${esc({put:&#x27;寄存文件&#x27;,take:&#x27;取件&#x27;,detail:&#x27;文件详情&#x27;,settings:&#x27;连接设置&#x27;,success:&#x27;寄存完成&#x27;,uploading:&#x27;寄存进度&#x27;,received:&#x27;领取结果&#x27;}[s.screen]||&#x27;&#x27;)}&lt;/span&gt;&lt;/div&gt;`;
 const stateLabel=i=&gt;i.state===&#x27;shareFailed&#x27;?&#x27;分享未完成&#x27;:i.state===&#x27;expired&#x27;?&#x27;已过期 · 待清理&#x27;:i.state===&#x27;exhausted&#x27;?&#x27;次数用尽 · 待清理&#x27;:i.state===&#x27;cleaned&#x27;?&#x27;已清理&#x27;:i.state===&#x27;deleted&#x27;?&#x27;已禁用 · 待清理&#x27;:i.usage===&#x27;share&#x27;?&#x27;分享已开启&#x27;:&#x27;可领取&#x27;;
 const live=i=&gt;[&#x27;active&#x27;,&#x27;shareFailed&#x27;].includes(i.state);
 function fileRows(){const items=s.items.filter(i=&gt;(s.filter===&#x27;all&#x27;||(s.filter===&#x27;active&#x27;?live(i):!live(i)))&amp;&amp;i.name.toLowerCase().includes(s.q.toLowerCase()));
 return items.length?items.map(i=&gt;`&lt;div class=&quot;lk-file&quot;&gt;&lt;div class=&quot;lk-file-main&quot;&gt;&lt;span class=&quot;lk-file-icon&quot;&gt;${icon(i.type)}&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;lk-name&quot;&gt;${esc(i.name)}&lt;/div&gt;&lt;div class=&quot;lk-small&quot;&gt;${i.size} · ${i.usage===&#x27;share&#x27;?&#x27;分享给他人&#x27;:&#x27;自己取用&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;${i.time}&lt;/div&gt;&lt;div class=&quot;lk-small&quot;&gt;${live(i)?`剩余 ${i.left} / ${i.total} 次领取`:&#x27;已停止新的取件&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lk-file-status&quot;&gt;&lt;span class=&quot;lk-badge ${[&#x27;shareFailed&#x27;,&#x27;expired&#x27;,&#x27;deleted&#x27;,&#x27;exhausted&#x27;].includes(i.state)?&#x27;warn&#x27;:i.state===&#x27;cleaned&#x27;?&#x27;muted&#x27;:&#x27;&#x27;}&quot;&gt;${stateLabel(i)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-file-actions&quot;&gt;${link(i.state===&#x27;shareFailed&#x27;?&#x27;处理分享&#x27;:live(i)?&#x27;查看详情&#x27;:&#x27;查看状态&#x27;,&#x27;detail-&#x27;+i.id)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;):`&lt;div class=&quot;lk-empty&quot;&gt;${icon(&#x27;inbox&#x27;)}&lt;h3&gt;${s.q?&#x27;没有匹配的寄存文件&#x27;:s.filter===&#x27;ended&#x27;?&#x27;暂无已结束的寄存&#x27;:&#x27;还没有寄存文件&#x27;}&lt;/h3&gt;&lt;p&gt;${s.q?&#x27;换一个文件名试试。&#x27;:&#x27;选择文件，设置领取规则，然后开始寄存。&#x27;}&lt;/p&gt;${s.q?button(&#x27;清空搜索&#x27;,&#x27;clear-search&#x27;):button(&#x27;寄存第一个文件&#x27;,&#x27;put&#x27;,&#x27;lk-primary&#x27;,&#x27;plus&#x27;)}&lt;/div&gt;`;}
 function home(){return `&lt;div class=&quot;lk-head&quot;&gt;&lt;div&gt;&lt;h2&gt;文件寄存柜&lt;/h2&gt;&lt;p&gt;临时加密存放，交接后及时清理。&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;lk-button cursor-interaction&quot; data-act=&quot;settings&quot; aria-label=&quot;连接设置&quot;&gt;${icon(&#x27;settings-2&#x27;)}&lt;span&gt;连接设置&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;
 &lt;div class=&quot;lk-statusbar&quot;&gt;&lt;div class=&quot;lk-row&quot;&gt;&lt;span&gt;&lt;span class=&quot;lk-dot ${s.configured?&#x27;&#x27;:&#x27;wait&#x27;}&quot;&gt;&lt;/span&gt;云存储 · ${s.configured?&#x27;已连接&#x27;:&#x27;待配置&#x27;}&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;lk-dot ${s.configured?&#x27;&#x27;:&#x27;wait&#x27;}&quot;&gt;&lt;/span&gt;取件服务 · ${s.configured?&#x27;已就绪&#x27;:&#x27;待配置&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;lk-small&quot;&gt;${s.configured?&#x27;刚刚更新&#x27;:link(&#x27;完成连接 →&#x27;,&#x27;settings&#x27;)}&lt;/span&gt;&lt;/div&gt;
 ${!s.configured?`&lt;div class=&quot;lk-notice&quot;&gt;${icon(&#x27;plug&#x27;)}&lt;div&gt;&lt;strong&gt;先连接自己的云存储&lt;/strong&gt;&lt;div&gt;完成连接后，即可寄存和管理领取次数。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}
 ${quick?`&lt;div class=&quot;lk-quick-grid&quot;&gt;&lt;button class=&quot;lk-quick cursor-interaction&quot; data-act=&quot;put&quot;&gt;&lt;span class=&quot;lk-file-icon&quot;&gt;${icon(&#x27;upload&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;strong&gt;寄存文件&lt;/strong&gt;&lt;small&gt;选择文件，设定有效期与领取次数&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;lk-quick cursor-interaction&quot; data-act=&quot;take&quot;&gt;&lt;span class=&quot;lk-file-icon&quot;&gt;${icon(&#x27;download&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;strong&gt;取件&lt;/strong&gt;&lt;small&gt;取回自己的文件，或接收他人分享&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;lk-toolbar&quot;&gt;&lt;h3&gt;我的寄存&lt;/h3&gt;&lt;span class=&quot;lk-small&quot;&gt;${s.items.filter(live).length} 项进行中&lt;/span&gt;&lt;/div&gt;`:`&lt;div class=&quot;lk-toolbar&quot;&gt;&lt;div class=&quot;lk-row&quot;&gt;${button(&#x27;寄存文件&#x27;,&#x27;put&#x27;,&#x27;lk-primary&#x27;,&#x27;plus&#x27;)}${button(&#x27;取件&#x27;,&#x27;take&#x27;,&#x27;&#x27;,&#x27;download&#x27;)}&lt;/div&gt;&lt;span class=&quot;lk-small&quot;&gt;${s.items.filter(live).length} 项进行中&lt;/span&gt;&lt;/div&gt;`}
 &lt;div class=&quot;lk-panel&quot;&gt;&lt;div class=&quot;lk-filters&quot;&gt;&lt;div class=&quot;lk-tabs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;lk-tab cursor-interaction&quot; data-filter=&quot;active&quot; aria-pressed=&quot;${s.filter===&#x27;active&#x27;}&quot;&gt;进行中&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;lk-tab cursor-interaction&quot; data-filter=&quot;ended&quot; aria-pressed=&quot;${s.filter===&#x27;ended&#x27;}&quot;&gt;已结束&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;lk-tab cursor-interaction&quot; data-filter=&quot;all&quot; aria-pressed=&quot;${s.filter===&#x27;all&#x27;}&quot;&gt;全部&lt;/button&gt;&lt;/div&gt;&lt;label class=&quot;lk-search&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input class=&quot;lk-input&quot; data-input=&quot;search&quot; aria-label=&quot;搜索文件名&quot; placeholder=&quot;搜索文件名&quot; value=&quot;${esc(s.q)}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;lk-table-head&quot;&gt;&lt;span&gt;文件&lt;/span&gt;&lt;span&gt;有效期 / 领取次数&lt;/span&gt;&lt;span&gt;当前状态&lt;/span&gt;&lt;span style=&quot;text-align:right&quot;&gt;操作&lt;/span&gt;&lt;/div&gt;&lt;div data-list&gt;${fileRows()}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lk-footer&quot;&gt;&lt;span&gt;${icon(&#x27;shield-check&#x27;)} 文件加密存储在你的云存储中&lt;/span&gt;&lt;span&gt;结束记录保留 7 天&lt;/span&gt;&lt;/div&gt;`;}
 function put(){return `${back()}&lt;div class=&quot;lk-head&quot;&gt;&lt;div&gt;&lt;h2&gt;寄存文件&lt;/h2&gt;&lt;p&gt;先选文件，再确认这次交接的规则。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${!s.configured?`&lt;div class=&quot;lk-notice warn&quot;&gt;${icon(&#x27;plug&#x27;)}&lt;div&gt;云存储与取件服务尚未就绪。${link(&#x27;去完成连接&#x27;,&#x27;settings&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;lk-grid&quot;&gt;&lt;div class=&quot;lk-panel lk-panel-pad lk-stack&quot;&gt;&lt;div&gt;&lt;h3&gt;1. 选择文件&lt;/h3&gt;${s.picked?`&lt;div class=&quot;lk-selected&quot;&gt;&lt;span class=&quot;lk-file-icon&quot;&gt;${icon(&#x27;archive&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;lk-name&quot;&gt;交接资料.zip&lt;/div&gt;&lt;div class=&quot;lk-small&quot;&gt;8.4 MiB · ${s.selected===&#x27;vault&#x27;?&#x27;来自文件保险库&#x27;:&#x27;来自本地文件&#x27;}&lt;/div&gt;&lt;/div&gt;${link(&#x27;移除&#x27;,&#x27;remove-file&#x27;)}&lt;/div&gt;`:`&lt;div class=&quot;lk-drop&quot;&gt;&lt;span class=&quot;lk-upload-icon&quot;&gt;${icon(&#x27;upload&#x27;)}&lt;/span&gt;&lt;div&gt;把文件拖到这里，或选择文件&lt;/div&gt;&lt;div class=&quot;lk-row&quot;&gt;${button(&#x27;选择文件&#x27;,&#x27;choose-file&#x27;,&#x27;&#x27;,&#x27;folder-open&#x27;)}${link(&#x27;从文件保险库选择&#x27;,&#x27;choose-vault&#x27;)}&lt;/div&gt;&lt;span class=&quot;lk-small&quot;&gt;每次寄存 1 个文件 · 最大 100 MiB&lt;/span&gt;&lt;/div&gt;`}&lt;/div&gt;
 &lt;label class=&quot;lk-field&quot;&gt;显示名称&lt;input class=&quot;lk-input&quot; data-input=&quot;name&quot; value=&quot;${esc(s.putName)}&quot; maxlength=&quot;120&quot;&gt;&lt;/label&gt;
 &lt;div&gt;&lt;h3&gt;2. 领取规则&lt;/h3&gt;&lt;div class=&quot;lk-grid-two&quot;&gt;&lt;label class=&quot;lk-field&quot;&gt;有效期&lt;select class=&quot;lk-select&quot; data-input=&quot;ttl&quot;&gt;${[[&#x27;1&#x27;,&#x27;1 小时&#x27;],[&#x27;24&#x27;,&#x27;24 小时 · 推荐&#x27;],[&#x27;168&#x27;,&#x27;7 天&#x27;],[&#x27;720&#x27;,&#x27;30 天&#x27;]].map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${s.ttl===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${t}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;lk-field&quot;&gt;可领取次数&lt;select class=&quot;lk-select&quot; data-input=&quot;pulls&quot;&gt;${[[&#x27;1&#x27;,&#x27;1 次 · 推荐&#x27;],[&#x27;3&#x27;,&#x27;3 次&#x27;],[&#x27;5&#x27;,&#x27;5 次&#x27;]].map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${s.pulls===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${t}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;h3&gt;3. 用途&lt;/h3&gt;&lt;div class=&quot;lk-grid-two&quot;&gt;${[&#x27;self&#x27;,&#x27;share&#x27;].map(v=&gt;`&lt;label class=&quot;lk-radio&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;purpose-${quick}&quot; data-input=&quot;purpose&quot; value=&quot;${v}&quot; ${s.purpose===v?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${v===&#x27;self&#x27;?&#x27;自己取用&#x27;:&#x27;分享给他人&#x27;}&lt;small&gt;${v===&#x27;self&#x27;?&#x27;在我的工作空间内取回&#x27;:&#x27;完成后生成链接与取件码&#x27;}&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;aside class=&quot;lk-panel lk-panel-pad&quot;&gt;&lt;h3&gt;本次寄存&lt;/h3&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;文件大小&lt;/span&gt;&lt;span&gt;${s.picked?&#x27;8.4 MiB&#x27;:&#x27;尚未选择&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;存放时间&lt;/span&gt;&lt;span data-summary-time&gt;${Number(s.ttl)&gt;=24?Number(s.ttl)/24+&#x27; 天&#x27;:s.ttl+&#x27; 小时&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;领取名额&lt;/span&gt;&lt;strong data-summary-pulls&gt;${s.pulls} 次&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;lk-notice&quot;&gt;${icon(&#x27;clock-3&#x27;)}&lt;div&gt;寄存完成后开始计时。到期或名额用完后，停止新的取件并清理文件。&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;lk-button lk-primary cursor-interaction&quot; data-act=&quot;start-put&quot; ${!s.picked||!s.configured?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${icon(&#x27;lock-keyhole&#x27;)}开始寄存&lt;/button&gt;&lt;div class=&quot;lk-term&quot;&gt;选文件不会立即上传。&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;`;}
 function upload(){return `${back()}&lt;div class=&quot;lk-result lk-panel lk-panel-pad&quot;&gt;&lt;h2&gt;正在寄存&lt;/h2&gt;&lt;p&gt;${esc(s.putName)} · 8.4 MiB&lt;/p&gt;${[&#x27;本机加密&#x27;,&#x27;上传到云存储&#x27;,&#x27;登记领取规则&#x27;].map((v,i)=&gt;`&lt;div class=&quot;lk-step ${i&lt;s.progress?&#x27;done&#x27;:i===s.progress?&#x27;current&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;lk-stepnum&quot;&gt;${i&lt;s.progress?&#x27;✓&#x27;:i+1}&lt;/span&gt;&lt;span&gt;${v}${i===s.progress?&#x27;…&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;lk-term&quot;&gt;可以返回列表，任务会继续处理。&lt;/div&gt;${button(&#x27;返回列表&#x27;,&#x27;home&#x27;)}&lt;/div&gt;`;}
 function success(){return `${back()}&lt;div class=&quot;lk-result lk-panel lk-panel-pad&quot;&gt;&lt;div class=&quot;lk-success-icon&quot;&gt;${icon(&#x27;check&#x27;)}&lt;/div&gt;&lt;h2&gt;文件已寄存&lt;/h2&gt;&lt;p&gt;${esc(s.putName)} · ${Number(s.ttl)&lt;24?s.ttl+&#x27; 小时&#x27;:Number(s.ttl)/24+&#x27; 天&#x27;}有效 · 可领取 ${s.pulls} 次&lt;/p&gt;&lt;div style=&quot;margin-top:24px&quot; class=&quot;lk-small&quot;&gt;取件码&lt;/div&gt;&lt;div class=&quot;lk-code&quot;&gt;123 456&lt;/div&gt;${s.purpose===&#x27;share&#x27;?`&lt;label class=&quot;lk-field&quot;&gt;分享链接&lt;input class=&quot;lk-input&quot; readonly aria-label=&quot;示例分享链接&quot; value=&quot;https://locker.example.invalid/d/demoLocker01#example-key&quot;&gt;&lt;/label&gt;&lt;div class=&quot;lk-term&quot;&gt;对方需要完整链接与取件码，请只发给预期接收人。&lt;/div&gt;`:`&lt;div class=&quot;lk-notice&quot;&gt;${icon(&#x27;user-round&#x27;)}&lt;div&gt;本次仅供自己取用。进入同一工作空间，可用取件码取回。&lt;/div&gt;&lt;/div&gt;`}&lt;div class=&quot;lk-row&quot; style=&quot;margin-top:22px&quot;&gt;${button(s.purpose===&#x27;share&#x27;?&#x27;复制交接信息&#x27;:&#x27;复制取件码&#x27;,&#x27;copy&#x27;,&#x27;lk-primary&#x27;,&#x27;copy&#x27;)}${button(&#x27;返回寄存柜&#x27;,&#x27;home&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
 function take(){return `${back()}&lt;div class=&quot;lk-head&quot;&gt;&lt;div&gt;&lt;h2&gt;取件&lt;/h2&gt;&lt;p&gt;先查询文件，再确认保存位置。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lk-grid&quot;&gt;&lt;div class=&quot;lk-panel lk-panel-pad lk-stack&quot;&gt;&lt;div class=&quot;lk-tabs&quot;&gt;&lt;button class=&quot;lk-tab cursor-interaction&quot; data-receive=&quot;self&quot; aria-pressed=&quot;${s.receiveType===&#x27;self&#x27;}&quot;&gt;我的寄存&lt;/button&gt;&lt;button class=&quot;lk-tab cursor-interaction&quot; data-receive=&quot;share&quot; aria-pressed=&quot;${s.receiveType===&#x27;share&#x27;}&quot;&gt;收到的分享&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;lk-small&quot;&gt;${s.receiveType===&#x27;self&#x27;?&#x27;取件码用于查找当前工作空间中的寄存。&#x27;:&#x27;请粘贴对方发来的完整链接，包含 # 后的内容。&#x27;}&lt;/p&gt;${s.receiveType===&#x27;share&#x27;?`&lt;label class=&quot;lk-field&quot;&gt;分享链接&lt;input class=&quot;lk-input&quot; data-input=&quot;link&quot; value=&quot;${esc(s.link)}&quot; placeholder=&quot;https://…/d/…#…&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;`:&#x27;&#x27;}&lt;label class=&quot;lk-field&quot;&gt;6 位取件码&lt;input class=&quot;lk-input&quot; data-input=&quot;code&quot; value=&quot;${esc(s.code)}&quot; placeholder=&quot;输入或粘贴取件码&quot; inputmode=&quot;numeric&quot; autocomplete=&quot;one-time-code&quot; maxlength=&quot;12&quot;&gt;&lt;/label&gt;${s.error?`&lt;div class=&quot;lk-error&quot; role=&quot;alert&quot;&gt;${esc(s.error)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div&gt;${button(&#x27;查询文件&#x27;,&#x27;lookup&#x27;,&#x27;lk-primary&#x27;,&#x27;search&#x27;)}&lt;/div&gt;&lt;p class=&quot;lk-small&quot;&gt;查询文件不会消耗领取名额。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;lk-panel lk-panel-pad&quot;&gt;${s.queried?`&lt;span class=&quot;lk-badge&quot;&gt;可领取&lt;/span&gt;&lt;h3 style=&quot;margin-top:15px&quot;&gt;${esc(s.receiveItem.name)}&lt;/h3&gt;&lt;p&gt;${s.receiveItem.size} · ${s.receiveItem.time}&lt;/p&gt;&lt;div class=&quot;lk-rule&quot; style=&quot;margin-top:18px&quot;&gt;&lt;span&gt;剩余名额&lt;/span&gt;&lt;span class=&quot;lk-amount&quot;&gt;${s.receiveItem.left} 次&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;保存到&lt;/h3&gt;&lt;div class=&quot;lk-stack&quot;&gt;${[&#x27;local&#x27;,&#x27;vault&#x27;].map(v=&gt;`&lt;label class=&quot;lk-radio&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;target-${quick}&quot; data-input=&quot;target&quot; value=&quot;${v}&quot; ${s.target===v?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${v===&#x27;local&#x27;?&#x27;本地文件夹&#x27;:&#x27;文件保险库&#x27;}&lt;small&gt;${v===&#x27;local&#x27;?&#x27;先选择位置，再开始领取&#x27;:&#x27;作为长期加密文件保存&#x27;}&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;lk-term&quot;&gt;确认领取将使用 1 个名额。&lt;/div&gt;&lt;div style=&quot;margin-top:16px&quot;&gt;${button(&#x27;领取并保存&#x27;,&#x27;receive&#x27;,&#x27;lk-primary&#x27;,&#x27;download&#x27;)}&lt;/div&gt;`:`&lt;div class=&quot;lk-empty&quot;&gt;${icon(&#x27;file-search&#x27;)}&lt;h3&gt;等待查询文件&lt;/h3&gt;&lt;p&gt;验证取件信息后，在这里确认有效期、领取名额与保存位置。&lt;/p&gt;&lt;/div&gt;`}&lt;/aside&gt;&lt;/div&gt;`;}
 function received(){return `${back()}&lt;div class=&quot;lk-result lk-panel lk-panel-pad&quot;&gt;&lt;div class=&quot;lk-success-icon&quot;&gt;${icon(&#x27;check&#x27;)}&lt;/div&gt;&lt;h2&gt;文件已保存&lt;/h2&gt;&lt;p&gt;${esc(s.receiveItem.name)}&lt;/p&gt;&lt;div class=&quot;lk-rule&quot; style=&quot;margin-top:24px&quot;&gt;&lt;span&gt;保存位置&lt;/span&gt;&lt;span&gt;${s.target===&#x27;local&#x27;?&#x27;下载文件夹&#x27;:&#x27;文件保险库&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;本次领取&lt;/span&gt;&lt;span&gt;已使用 1 个名额&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;剩余名额&lt;/span&gt;&lt;span&gt;${s.receivedRemaining} 次&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-row&quot;&gt;${button(s.target===&#x27;local&#x27;?&#x27;打开所在文件夹&#x27;:&#x27;前往文件保险库&#x27;,&#x27;open-result&#x27;,&#x27;lk-primary&#x27;,&#x27;folder-open&#x27;)}${button(&#x27;返回寄存柜&#x27;,&#x27;home&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
 function detail(){const i=s.items.find(v=&gt;v.id===s.detail);if(!i)return home();return `${back()}&lt;div class=&quot;lk-head&quot;&gt;&lt;div&gt;&lt;h2&gt;${esc(i.name)}&lt;/h2&gt;&lt;p&gt;${i.size} · ${i.usage===&#x27;share&#x27;?&#x27;分享给他人&#x27;:&#x27;自己取用&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;lk-badge ${live(i)?&#x27;&#x27;:&#x27;warn&#x27;}&quot;&gt;${stateLabel(i)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-grid&quot;&gt;&lt;div class=&quot;lk-panel lk-panel-pad&quot;&gt;&lt;h3&gt;领取与有效期&lt;/h3&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;有效期&lt;/span&gt;&lt;span&gt;${i.time}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;剩余名额&lt;/span&gt;&lt;span&gt;${live(i)?i.left+&#x27; / &#x27;+i.total+&#x27; 次&#x27;:&#x27;不可领取&#x27;}&lt;/span&gt;&lt;/div&gt;${live(i)?`${button(&#x27;取回文件&#x27;,&#x27;take-item&#x27;,&#x27;&#x27;,&#x27;download&#x27;)}&lt;div class=&quot;lk-term&quot;&gt;查看详情、复制分享信息不消耗名额。&lt;/div&gt;`:`&lt;div class=&quot;lk-notice warn&quot;&gt;${icon(&#x27;clock-3&#x27;)}&lt;div&gt;${i.state===&#x27;cleaned&#x27;?&#x27;云端清理已确认完成。&#x27;:&#x27;已停止新的取件，云端清理尚未确认完成。&#x27;}&lt;/div&gt;&lt;/div&gt;${i.state!==&#x27;cleaned&#x27;?button(&#x27;重试清理&#x27;,&#x27;cleanup&#x27;,&#x27;&#x27;,&#x27;refresh-cw&#x27;):&#x27;&#x27;}`}&lt;div style=&quot;margin-top:30px&quot;&gt;&lt;h3&gt;文件管理&lt;/h3&gt;&lt;p class=&quot;lk-small&quot;&gt;删除会停止取件、失效链接并清理云端文件。&lt;/p&gt;${live(i)?link(&#x27;删除寄存文件&#x27;,&#x27;ask-delete&#x27;,&#x27;lk-danger&#x27;):&#x27;&#x27;}${s.confirm===&#x27;delete&#x27;?`&lt;div class=&quot;lk-notice warn&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div&gt;确定删除「${esc(i.name)}」？未完成的领取恢复也会停止。&lt;div class=&quot;lk-row&quot; style=&quot;margin-top:10px&quot;&gt;${button(&#x27;确认删除&#x27;,&#x27;confirm-delete&#x27;)}${button(&#x27;取消&#x27;,&#x27;cancel-confirm&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;lk-panel lk-panel-pad&quot;&gt;&lt;h3&gt;分享与取件码&lt;/h3&gt;${i.state===&#x27;shareFailed&#x27;?`&lt;div class=&quot;lk-notice warn&quot;&gt;${icon(&#x27;triangle-alert&#x27;)}&lt;div&gt;文件已寄存，分享链接暂未生成。不需要重新上传。&lt;/div&gt;&lt;/div&gt;${button(&#x27;重试生成分享&#x27;,&#x27;enable-share&#x27;,&#x27;lk-primary&#x27;,&#x27;refresh-cw&#x27;)}`:!live(i)?`&lt;p&gt;该文件已不可领取，分享入口已失效。&lt;/p&gt;`:i.usage===&#x27;share&#x27;?`&lt;span class=&quot;lk-badge&quot;&gt;分享已开启&lt;/span&gt;&lt;p style=&quot;margin-top:15px&quot;&gt;对方可通过完整链接与取件码领取。&lt;/p&gt;&lt;div class=&quot;lk-row&quot; style=&quot;margin-top:16px&quot;&gt;${button(&#x27;查看交接信息&#x27;,&#x27;show-share&#x27;,&#x27;lk-primary&#x27;,&#x27;link&#x27;)}${link(&#x27;停止分享&#x27;,&#x27;ask-stop&#x27;)}&lt;/div&gt;&lt;div class=&quot;lk-term&quot;&gt;停止分享后，文件仍供自己取用。已经下载的副本无法撤回。&lt;/div&gt;`:`&lt;p&gt;仅供自己取用。生成分享入口后，才能交给他人领取。&lt;/p&gt;&lt;div style=&quot;margin-top:18px&quot;&gt;${button(&#x27;生成分享入口&#x27;,&#x27;enable-share&#x27;,&#x27;lk-primary&#x27;,&#x27;link&#x27;)}${link(&#x27;查看取件码&#x27;,&#x27;show-code&#x27;)}&lt;/div&gt;`}${s.confirm===&#x27;stop&#x27;?`&lt;div class=&quot;lk-notice warn&quot; style=&quot;margin-top:15px&quot;&gt;&lt;div&gt;停止新的分享访问，保留寄存文件供自己取回。已经开始的交付可能继续。&lt;div class=&quot;lk-row&quot; style=&quot;margin-top:12px&quot;&gt;${button(&#x27;确认停止&#x27;,&#x27;confirm-stop&#x27;)}${button(&#x27;取消&#x27;,&#x27;cancel-confirm&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}${s.confirm===&#x27;code&#x27;||s.confirm===&#x27;share&#x27;?`&lt;div class=&quot;lk-code&quot;&gt;123 456&lt;/div&gt;${s.confirm===&#x27;share&#x27;?&#x27;&lt;code&gt;https://locker.example.invalid/d/demoLocker01#example-key&lt;/code&gt;&#x27;:&#x27;&#x27;}&lt;div style=&quot;margin-top:12px&quot;&gt;${button(&#x27;复制交接信息&#x27;,&#x27;copy&#x27;,&#x27;&#x27;,&#x27;copy&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/aside&gt;&lt;/div&gt;`;}
 function settings(){return `${back()}&lt;div class=&quot;lk-head&quot;&gt;&lt;div&gt;&lt;h2&gt;连接设置&lt;/h2&gt;&lt;p&gt;连接一次，之后专注于寄存和取件。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lk-grid&quot;&gt;&lt;div class=&quot;lk-stack&quot;&gt;&lt;div class=&quot;lk-panel lk-panel-pad&quot;&gt;&lt;div class=&quot;lk-row lk-between&quot;&gt;&lt;h3&gt;1. 云存储&lt;/h3&gt;&lt;span class=&quot;lk-badge ${s.configured?&#x27;&#x27;:&#x27;warn&#x27;}&quot;&gt;${s.configured?&#x27;已连接&#x27;:&#x27;待配置&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;p&gt;复用你的云同步存储配置，文件以密文存放。&lt;/p&gt;&lt;label class=&quot;lk-field&quot; style=&quot;margin-top:16px&quot;&gt;存储位置&lt;input class=&quot;lk-input&quot; readonly value=&quot;我的云存储 / locker&quot;&gt;&lt;/label&gt;&lt;div style=&quot;margin-top:15px&quot;&gt;${button(&#x27;检测存储连接&#x27;,&#x27;check-storage&#x27;,&#x27;&#x27;,&#x27;refresh-cw&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lk-panel lk-panel-pad&quot;&gt;&lt;div class=&quot;lk-row lk-between&quot;&gt;&lt;h3&gt;2. 取件服务&lt;/h3&gt;&lt;span class=&quot;lk-badge ${s.configured?&#x27;&#x27;:&#x27;warn&#x27;}&quot;&gt;${s.configured?&#x27;已就绪&#x27;:&#x27;待配置&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;p&gt;统一管理领取次数，并支持浏览器分享取件。&lt;/p&gt;&lt;label class=&quot;lk-field&quot; style=&quot;margin-top:16px&quot;&gt;服务地址&lt;input class=&quot;lk-input&quot; readonly value=&quot;https://locker.example.invalid&quot;&gt;&lt;/label&gt;&lt;div class=&quot;lk-row&quot; style=&quot;margin-top:15px&quot;&gt;${button(s.configured?&#x27;重新检测&#x27;:&#x27;引导连接&#x27;,&#x27;connect&#x27;,&#x27;lk-primary&#x27;,&#x27;plug&#x27;)}${link(&#x27;查看高级设置&#x27;,&#x27;advanced&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;lk-panel lk-panel-pad&quot;&gt;&lt;h3&gt;可用能力&lt;/h3&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;加密寄存&lt;/span&gt;&lt;span&gt;${s.configured?&#x27;可用&#x27;:&#x27;待连接&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;有限次数领取&lt;/span&gt;&lt;span&gt;${s.configured?&#x27;可用&#x27;:&#x27;待连接&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lk-rule&quot;&gt;&lt;span&gt;网页分享&lt;/span&gt;&lt;span&gt;${s.configured?&#x27;可用&#x27;:&#x27;待连接&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;lk-small&quot;&gt;连接检测会验证服务版本和存储绑定，不会消耗真实文件的领取次数。&lt;/p&gt;&lt;div style=&quot;margin-top:20px&quot;&gt;${button(&#x27;完成，返回寄存柜&#x27;,&#x27;home&#x27;)}&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;`;}
 function render(){app.innerHTML=`&lt;div class=&quot;lk-chrome&quot;&gt;&lt;div class=&quot;lk-brand&quot;&gt;${icon(&#x27;key-round&#x27;)}御钥师 &lt;span class=&quot;lk-small&quot;&gt;/ 工具箱&lt;/span&gt;&lt;/div&gt;&lt;span&gt;设计演示 · 示例数据&lt;/span&gt;&lt;/div&gt;&lt;main class=&quot;lk-main&quot;&gt;${({home,put,uploading:upload,success,take,received,detail,settings}[s.screen]||home)()}&lt;div class=&quot;lk-note&quot;&gt;交互示例 · 取件码 123 456 · 不实际上传、下载或复制&lt;/div&gt;&lt;/main&gt;&lt;div class=&quot;lk-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; ${s.toast?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;${esc(s.toast)}&lt;/div&gt;`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
 function toast(message){s.toast=message;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=&gt;{s.toast=&#x27;&#x27;;const el=app.querySelector(&#x27;.lk-toast&#x27;);if(el)el.hidden=true;},3500);}
 function navigate(screen){s.screen=screen;s.error=&#x27;&#x27;;s.confirm=&#x27;&#x27;;s.toast=&#x27;&#x27;;render();}
 app.addEventListener(&#x27;input&#x27;,e=&gt;{const el=e.target,k=el.dataset.input;if(!k)return;if(k===&#x27;search&#x27;){s.q=el.value;app.querySelector(&#x27;[data-list]&#x27;).innerHTML=fileRows();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}else if(k===&#x27;name&#x27;)s.putName=el.value;else if(k===&#x27;code&#x27;||k===&#x27;link&#x27;){s[k]=el.value;const stale=s.queried;s.queried=false;if(stale){const cursor=el.selectionStart;render();const next=app.querySelector(`[data-input=&quot;${k}&quot;]`);next.focus();next.setSelectionRange(cursor,cursor);}}});
 app.addEventListener(&#x27;change&#x27;,e=&gt;{const k=e.target.dataset.input;if([&#x27;ttl&#x27;,&#x27;pulls&#x27;,&#x27;purpose&#x27;,&#x27;target&#x27;].includes(k)){s[k]=e.target.value;render();}});
 app.addEventListener(&#x27;click&#x27;,e=&gt;{const el=e.target.closest(&#x27;button&#x27;);if(!el||el.disabled)return;if(el.dataset.filter){s.filter=el.dataset.filter;render();return;}if(el.dataset.receive){s.receiveType=el.dataset.receive;s.queried=false;s.error=&#x27;&#x27;;render();return;}const a=el.dataset.act;if(!a)return;
 if([&#x27;home&#x27;,&#x27;put&#x27;,&#x27;take&#x27;,&#x27;settings&#x27;].includes(a)){if(a===&#x27;take&#x27;){s.queried=false;s.code=&#x27;&#x27;;s.link=&#x27;&#x27;;s.receiveItem=structuredClone(s.items.find(i=&gt;i.id===1)||samples[0]);}navigate(a);}
 else if(a.startsWith(&#x27;detail-&#x27;)){s.detail=Number(a.slice(7));navigate(&#x27;detail&#x27;);}
