<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文件寄存柜 · 界面预览 2.0</title>
<style>
  :root {
    --ink: #0c1f38;
    --sub: #5d708a;
    --blue: #2563eb;
    --blue-hi: #4b8dff;
    --blue-edge: #1b42a8;
    --steel: #cdd8e6;
    --door-edge: #bcc8d8;
    --lcd: #09182b;
    --lcd-ink: #b9ffe0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 460px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
      radial-gradient(700px 380px at 50% 42%, rgba(59,130,246,.12), transparent 68%),
      linear-gradient(180deg, #eff4fb 0%, #dfe8f3 58%, #cfdae9 100%);
  }
  .viewer { max-width: 1020px; margin: 0 auto; padding: 20px 20px 60px; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .frames { display: flex; gap: 6px; flex-wrap: wrap; }
  .frames button {
    border: 0; background: rgba(255,255,255,.68); color: var(--ink);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 1px 0 #fff inset, 0 6px 14px rgba(12,31,56,.06);
  }
  .frames button.on { background: var(--ink); color: #fff; }
  .screen { display: none; }
  .screen.on { display: block; }

  .kiosk {
    position: relative;
    border-radius: 34px;
    padding: 22px 26px 34px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.78), rgba(244,248,253,.52));
    border: 1px solid rgba(255,255,255,.88);
    box-shadow:
      0 2px 0 #fff inset,
      0 32px 64px rgba(12,31,56,.12);
  }
  .kiosk-head { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 13px; font-weight: 700; color: var(--sub); letter-spacing: .08em; }
  .gear {
    width: 38px; height: 38px; border-radius: 13px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #e9eff7);
    color: var(--ink);
    display: grid; place-items: center;
    box-shadow: 0 1px 0 #fff inset, 0 4px 0 #c6d2e2, 0 10px 16px rgba(12,31,56,.1);
  }
  .prompt {
    text-align: center;
    margin: 6px 0 18px;
    font-size: 14px;
    color: var(--sub);
    letter-spacing: .16em;
  }
  .prompt::before {
    content: "";
    display: block;
    width: 44px; height: 3px; border-radius: 99px;
    background: var(--blue);
    margin: 0 auto 10px;
  }

  .ops {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    max-width: 720px;
    margin: 0 auto 30px;
    perspective: 1200px;
  }
  .op {
    border: 0;
    cursor: pointer;
    font: inherit;
    border-radius: 26px;
    min-height: 178px;
    padding: 20px 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transform: rotateX(6deg);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .op::after {
    content: "";
    position: absolute;
    inset: 8px 14px auto;
    height: 22px;
    border-radius: 99px;
    background: linear-gradient(180deg, rgba(255,255,255,.55), transparent);
    pointer-events: none;
  }
  .op.store {
    color: var(--blue);
    background: linear-gradient(180deg, #ffffff 0%, #f5f8fd 72%, #e9f0fa 100%);
    box-shadow:
      0 2px 0 #ffffff inset,
      0 -1px 0 rgba(37,99,235,.08) inset,
      0 14px 0 #c9d5e6,
      0 26px 34px rgba(12,31,56,.14);
  }
  .op.take {
    color: #fff;
    background:
      radial-gradient(220px 110px at 50% 0%, rgba(255,255,255,.28), transparent 70%),
      linear-gradient(180deg, var(--blue-hi) 0%, var(--blue) 58%, #1e50d6 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,.55) inset,
      0 14px 0 var(--blue-edge),
      0 26px 36px rgba(37,99,235,.32);
  }
  .op:hover { transform: rotateX(6deg) translateY(-3px); }
  .op:active { transform: rotateX(6deg) translateY(7px); }
  .medallion {
    width: 62px; height: 62px; border-radius: 20px;
    display: grid; place-items: center;
    margin-bottom: 4px;
  }
  .op.store .medallion {
    background: linear-gradient(160deg, #f3f7ff, #dbe7ff);
    box-shadow: 0 2px 0 #fff inset, 0 6px 0 #bfd3fb, 0 10px 16px rgba(37,99,235,.14);
  }
  .op.take .medallion {
    background: linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,.1));
    box-shadow: 0 1px 0 rgba(255,255,255,.65) inset, 0 6px 0 rgba(13,38,107,.35);
  }
  .op strong { font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: .08em; }
  .op span { font-size: 13.5px; font-weight: 600; opacity: .86; }

  .chassis {
    max-width: 840px;
    margin: 0 auto;
    border-radius: 30px;
    padding: 18px 18px 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.65), transparent 22%),
      linear-gradient(180deg, #cfd9e7 0%, #b7c5d8 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,.85) inset,
      0 -3px 0 #96a7be inset,
      0 20px 0 #95a5bc,
      0 34px 44px rgba(12,31,56,.2);
  }
  .chassis-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 12px;
    font-size: 12px; font-weight: 700; color: #445873; letter-spacing: .08em;
  }
  .bay {
    background: #8d9db4;
    padding: 12px;
    border-radius: 22px;
    box-shadow: inset 0 6px 12px rgba(12,31,56,.28), 0 1px 0 rgba(255,255,255,.55);
  }
  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .door {
    border: 0;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: var(--ink);
    border-radius: 18px;
    padding: 14px 14px 14px 16px;
    position: relative;
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 14px;
    align-items: center;
    background:
      linear-gradient(180deg, #ffffff 0%, #f1f5fb 68%, #e2eaf4 100%);
    box-shadow:
      0 2px 0 #fff inset,
      -1px 0 0 rgba(255,255,255,.8) inset,
      0 9px 0 var(--door-edge),
      0 14px 18px rgba(12,31,56,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .door:hover { transform: translateY(-3px); }
  .door:active { transform: translateY(4px); box-shadow: 0 2px 0 #fff inset, 0 4px 0 var(--door-edge); }
  .door::before {
    content: attr(data-slot);
    position: absolute;
    top: 10px; right: 14px;
    font-size: 11px; font-weight: 800; letter-spacing: .08em;
    color: #7d8fa8;
    font-variant-numeric: tabular-nums;
  }
  .handle {
    position: absolute;
    right: 12px; bottom: 14px;
    width: 6px; height: 28px; border-radius: 99px;
    background: linear-gradient(180deg, #b8c5d6, #dce5f0);
    box-shadow: inset 0 2px 3px rgba(12,31,56,.25), 0 1px 0 #fff;
  }
  .led {
    position: absolute;
    top: 13px; right: 40px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }
  .door.expired .led { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

  .niche {
    height: 92px;
    border-radius: 15px;
    position: relative;
    display: grid;
    place-items: center;
    background:
      radial-gradient(60px 40px at 50% 22%, rgba(255,255,255,.9), transparent 70%),
      linear-gradient(180deg, #cfd9e8, #e8eef7);
    box-shadow:
      inset 0 6px 10px rgba(12,31,56,.18),
      inset 0 -2px 4px rgba(255,255,255,.9),
      0 1px 0 #fff;
  }
  .totem {
    width: 54px; height: 64px; border-radius: 14px;
    position: relative;
    transform: rotate(-4deg);
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .06em;
  }
  .totem::before {
    content: "";
    position: absolute; inset: 4px 6px auto; height: 12px;
    border-radius: 99px;
    background: linear-gradient(180deg, rgba(255,255,255,.55), transparent);
  }
  .totem.pdf { background: linear-gradient(160deg, #fb7185, #e11d48); box-shadow: 0 6px 0 #9f1239, 0 10px 14px rgba(225,29,72,.28); }
  .totem.img { background: linear-gradient(160deg, #60a5fa, #2563eb); box-shadow: 0 6px 0 #1d4ed8, 0 10px 14px rgba(37,99,235,.28); }
  .totem.key { background: linear-gradient(160deg, #34d399, #059669); box-shadow: 0 6px 0 #047857, 0 10px 14px rgba(5,150,105,.28); }
  .totem.doc { background: linear-gradient(160deg, #a78bfa, #6d28d9); box-shadow: 0 6px 0 #4c1d95, 0 10px 14px rgba(109,40,217,.28); }

  .meta { min-width: 0; padding-right: 18px; display: flex; flex-direction: column; gap: 7px; }
  .name { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lcd {
    font-variant-numeric: tabular-nums;
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 13px; font-weight: 700;
    color: var(--lcd-ink);
    background: var(--lcd);
    padding: 4px 10px;
    border-radius: 8px;
    width: fit-content;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.55), 0 1px 0 #fff;
  }
  .door.expired .lcd { color: #fecaca; background: #450a0a; }
  .pulls { font-size: 12.5px; font-weight: 700; color: var(--sub); }

  .sheet {
    max-width: 440px; margin: 10px auto 0;
    background: linear-gradient(180deg, #ffffff, #f6f9fe);
    border-radius: 30px; padding: 26px 24px 24px;
    box-shadow: 0 2px 0 #fff inset, 0 16px 0 #d0dceb, 0 28px 48px rgba(12,31,56,.14);
  }
  .back {
    border: 0; background: rgba(255,255,255,.75); color: var(--ink);
    border-radius: 99px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 1px 0 #fff inset, 0 4px 10px rgba(12,31,56,.06);
  }
  h2 { margin: 4px 0 0; text-align: center; font-size: 26px; letter-spacing: .04em; }
  .sub { text-align: center; color: var(--sub); margin: 6px 0 18px; font-size: 13.5px; }
  .drop {
    border: 1.5px dashed #b9cae0; border-radius: 20px; min-height: 132px;
    display: grid; place-items: center; text-align: center; color: var(--sub);
    background: linear-gradient(180deg, #f8fbff, #eef4fc);
    box-shadow: inset 0 3px 6px rgba(12,31,56,.05);
    margin-bottom: 12px; font-weight: 600;
  }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--sub); margin: 10px 0 6px; }
  .row { display: flex; gap: 10px; }
  select, input[type="text"], input[type="password"] {
    width: 100%; border: 1px solid #d7e2f0; border-radius: 13px; padding: 11px 12px; font: inherit; background: #fff;
    box-shadow: inset 0 2px 3px rgba(12,31,56,.04);
  }
  .primary, .ghost {
    width: 100%; border: 0; border-radius: 15px; padding: 14px; font: inherit; font-weight: 800; cursor: pointer; margin-top: 12px;
  }
  .primary {
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 8px 0 var(--blue-edge), 0 14px 22px rgba(37,99,235,.25);
  }
  .primary:disabled { background: #dce5f2; color: #8fa3bf; box-shadow: none; cursor: default; }
  .ghost { background: #edf2fa; color: var(--ink); box-shadow: 0 1px 0 #fff inset, 0 5px 0 #cfdaea; }

  .cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 4px 0 16px; }
  .cell {
    height: 54px; border-radius: 13px; background: #f3f7fc;
    border: 1px solid #d5e0ee;
    display: grid; place-items: center; font-size: 22px; font-weight: 800;
    box-shadow: inset 0 3px 5px rgba(12,31,56,.07), 0 1px 0 #fff;
  }
  .cell.fill { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .pad {
    background: #eef3fa; padding: 10px; border-radius: 20px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    box-shadow: inset 0 2px 5px rgba(12,31,56,.08);
  }
  .key {
    border: 0; border-radius: 13px; min-height: 50px; font: inherit; font-size: 20px; font-weight: 800;
    color: var(--ink); cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #edf2f9);
    box-shadow: 0 1px 0 #fff inset, 0 4px 0 #cad5e5;
  }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 #fff inset, 0 2px 0 #cad5e5; }
  .key.soft { font-size: 13px; color: var(--sub); }
  .code-hero {
    font-variant-numeric: tabular-nums;
    font-size: 38px; letter-spacing: .18em; text-align: center; font-weight: 900;
    background: var(--lcd); color: var(--lcd-ink); border-radius: 16px; padding: 14px 10px; margin: 10px 0;
  }
  .manage-top { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  @media (max-width: 720px) {
    .ops, .doors { grid-template-columns: 1fr; }
    .op { transform: none; }
  }
</style>
</head>
<body>
<div class="viewer">
  <div class="bar">
    <div class="frames" id="frames"></div>
  </div>

  <div class="kiosk">
    <section class="screen on" id="home">
      <div class="kiosk-head">
        <span class="brand">FILE LOCKER · 寄存柜</span>
        <button class="gear" data-go="config" aria-label="配置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div class="prompt">请选择操作</div>
      <div class="ops">
        <button class="op store" data-go="deposit">
          <span class="medallion" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V7"/><path d="m8.5 10.5 3.5-3.5 3.5 3.5"/><path d="M20 16.5A4.5 4.5 0 0 0 17.5 8h-1.1A7 7 0 1 0 4 14.9"/></svg>
          </span>
          <strong>寄</strong>
          <span>存入文件</span>
        </button>
        <button class="op take" data-go="pickup">
          <span class="medallion" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="14.5" r="3.5"/><path d="m11 12 8-8"/><path d="M16 4h3v3"/><path d="m15 8 2 2"/></svg>
          </span>
          <strong>取</strong>
          <span>取出文件</span>
        </button>
      </div>

      <div class="chassis">
        <div class="chassis-head">
          <span>已寄存柜门</span>
          <span>点柜门管理 · 再次看码需验证</span>
        </div>
        <div class="bay">
          <div class="doors" id="doors"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="deposit">
      <button class="back" data-go="home">← 返回柜门</button>
      <div class="sheet">
        <h2>存入文件</h2>
        <p class="sub">加密存入你自己的存储桶</p>
        <div class="drop">点击或拖入文件<br />单个不超过 100 MB</div>
        <label>展示名</label>
        <input type="text" placeholder="留空则用原文件名" />
        <div class="row">
          <div style="flex:1">
            <label>存放时长</label>
            <select><option>24 小时</option><option>1 小时</option><option>30 天</option><option>永久</option></select>
          </div>
          <div style="flex:1">
            <label>可取次数</label>
            <select><option>1 次</option><option>3 次</option><option>不限次数</option></select>
          </div>
        </div>
        <button class="ghost">从保险库寄出</button>
        <button class="primary" data-go="success">安全寄存</button>
      </div>
    </section>

    <section class="screen" id="pickup">
      <button class="back" data-go="home">← 返回柜门</button>
      <div class="sheet">
        <h2>请输入取件码</h2>
        <p class="sub">请输入 6 位取件码以取出您的文件</p>
        <div class="cells" id="cells"></div>
        <div class="pad" id="pad"></div>
        <button class="primary" id="confirm" disabled>确认取件</button>
      </div>
    </section>

    <section class="screen" id="manage">
      <button class="back" data-go="home">← 返回柜门</button>
      <div class="sheet" id="manage-body"></div>
    </section>

    <section class="screen" id="config">
      <button class="back" data-go="home">← 返回柜门</button>
      <div class="sheet">
        <h2>寄存柜配置</h2>
        <p class="sub">只在这里填写分享服务。没配也能寄、能取。</p>
        <label>Worker 地址</label>
        <input type="text" placeholder="https://locker.example.com" />
        <label>共享密钥</label>
        <input type="password" placeholder="已保存，留空则不修改" />
        <button class="primary" data-go="home">保存</button>
      </div>
    </section>

    <section class="screen" id="success">
      <button class="back" data-go="home">← 返回柜门</button>
      <div class="sheet">
        <h2>取件码已生成</h2>
        <p class="sub">关掉后再看，需要验证指纹或访问密码。</p>
        <div class="code-hero">482 193</div>
        <button class="ghost">复制取件码</button>
        <button class="primary">生成分享链接与二维码</button>
      </div>
    </section>
  </div>
</div>
<script>
const files = [
  { id: "a", slot: "A-01", name: "护照扫描件", kind: "pdf", label: "PDF", clock: 2 * 86400 + 4 * 3600 + 12 * 60 + 8, pulls: "剩余 1 次" },
  { id: "b", slot: "A-02", name: "恢复码截图", kind: "img", label: "IMG", clock: 18 * 3600 + 22 * 60 + 41, pulls: "剩余 3 次" },
  { id: "c", slot: "B-01", name: "旧私钥备份", kind: "key", label: "KEY", clock: null, pulls: "不限次数" },
  { id: "d", slot: "B-02", name: "房屋租赁合同", kind: "doc", label: "DOC", clock: 0, pulls: "剩余 1 次" }
];
const frames = [
  ["home", "主页"], ["deposit", "寄存"], ["pickup", "取件"],
  ["manage", "单份管理"], ["config", "配置"], ["success", "寄存成功"]
];
const frameBar = document.getElementById("frames");
frames.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.dataset.go = id;
  frameBar.appendChild(b);
});
function fmt(sec) {
  if (sec == null) return "永久";
  if (sec <= 0) return "已到期";
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const clock = [h, m, s].map((n) => String(n).padStart(2, "0")).join(":");
  return d > 0 ? `${d} 天 ${clock}` : clock;
}
function renderDoors() {
  document.getElementById("doors").innerHTML = files.map((f) => `
    <button class="door${f.clock === 0 ? " expired" : ""}" data-go="manage" data-file="${f.id}" data-slot="${f.slot}">
      <span class="led" aria-hidden="true"></span>
      <span class="handle" aria-hidden="true"></span>
      <div class="niche">
        <div class="totem ${f.kind}">${f.label}</div>
      </div>
      <div class="meta">
        <div class="name">${f.name}</div>
        <div class="lcd" data-clock="${f.id}">${fmt(f.clock)}</div>
        <div class="pulls">${f.pulls}</div>
      </div>
    </button>`).join("");
}
function openManage(file) {
  const body = document.getElementById("manage-body");
  body.dataset.ready = "1";
  body.innerHTML = `
    <div class="manage-top">
      <div class="niche" style="width:84px"><div class="totem ${file.kind}">${file.label}</div></div>
      <div>
        <div class="name">${file.name}</div>
        <div class="lcd" style="margin:6px 0">${fmt(file.clock)}</div>
        <div class="pulls">${file.pulls}</div>
      </div>
    </div>
    <button class="primary">取回文件</button>
    <button class="ghost">查看取件码 · 需验证</button>
    <button class="ghost">复制分享链接 / 二维码</button>
    <button class="ghost">焚毁</button>`;
}
function show(id) {
  document.querySelectorAll(".screen").forEach((n) => n.classList.toggle("on", n.id === id));
  document.querySelectorAll(".frames button").forEach((n) => n.classList.toggle("on", n.dataset.go === id));
  if (id === "manage" && !document.getElementById("manage-body").dataset.ready) openManage(files[0]);
}
document.body.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (!go) return;
  if (go.dataset.file) openManage(files.find((f) => f.id === go.dataset.file));
  show(go.dataset.go);
});
renderDoors();
setInterval(() => {
  files.forEach((f) => { if (typeof f.clock === "number" && f.clock > 0) f.clock -= 1; });
  document.querySelectorAll("[data-clock]").forEach((n) => {
    const f = files.find((x) => x.id === n.dataset.clock);
    n.textContent = fmt(f.clock);
  });
}, 1000);

const code = [];
const cells = document.getElementById("cells");
const pad = document.getElementById("pad");
function paint() {
  cells.innerHTML = Array.from({ length: 6 }, (_, i) =>
    `<div class="cell${code[i] ? " fill" : ""}">${code[i] || ""}</div>`).join("");
  document.getElementById("confirm").disabled = code.length !== 6;
}
["1","2","3","4","5","6","7","8","9","删除","0","重输"].forEach((k) => {
  const b = document.createElement("button");
  b.className = "key" + (k === "删除" || k === "重输" ? " soft" : "");
  b.textContent = k;
  b.onclick = () => {
    if (k === "删除") code.pop();
    else if (k === "重输") code.length = 0;
    else if (code.length < 6) code.push(k);
    paint();
  };
  pad.appendChild(b);
});
paint();
show("home");
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("pickup").classList.contains("on")) return;
  if (/\d/.test(e.key) && code.length < 6) code.push(e.key);
  if (e.key === "Backspace") code.pop();
  if (e.key === "Escape") code.length = 0;
  paint();
});
</script>
</body>
</html>
