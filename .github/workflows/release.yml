# 打包与发布只认 release 分支上的提交：
# - 只推 release 分支：不打包（避免和打标签各跑一轮）
# - 推送 v* 标签：先跑 2 路 Unix cargo test（preflight），通过后再 3 路桌面 + 1 路安卓出包
# - 手动 Run workflow：可选出包；勾选 create_release 时建草稿 Release
name: Release packages

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft GitHub Release and a single latest.json
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            echo "Building from release branch"
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git fetch origin release --depth=100
            if git merge-base --is-ancestor HEAD origin/release; then
              echo "Tag ${GITHUB_REF_NAME} is on release"
              exit 0
            fi
            echo "::error::v* 标签必须打在 release 分支的提交上"
            exit 1
          fi
          echo "::error::打包与发布只允许在 release 分支，或基于该分支的 v* 标签上执行"
          exit 1

      - name: Check branding and packaging invariants
        run: node scripts/check-release-invariants.mjs --test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-deps.sh

      - name: Run Rust tests
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --color always 2>&1 | tee rust-test.log

      - name: Upload rust test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-preflight-${{ matrix.os }}
          path: app/src-tauri/rust-test.log

  build:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            echo "Building from release branch"
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git fetch origin release --depth=100
            if git merge-base --is-ancestor HEAD origin/release; then
              echo "Tag ${GITHUB_REF_NAME} is on release"
              exit 0
            fi
            echo "::error::v* 标签必须打在 release 分支的提交上"
            exit 1
          fi
          echo "::error::打包与发布只允许在 release 分支，或基于该分支的 v* 标签上执行"
          exit 1

      - name: Decide release mode
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.create_release }}" == "true" ]]; then
            publish=true
            tag="v__VERSION__"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Load release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::缺少 CHANGELOG.md，无法写入升级说明"
            exit 1
          fi
          notes="$(bash scripts/build-release-notes.sh "$version")"
          delim="NOTES_EOF_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delim}"
            printf '%s\n' "$notes"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/ci-linux-deps.sh

      - name: Require updater signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]]; then
            echo "::error::缺少 Secrets.TAURI_SIGNING_PRIVATE_KEY，createUpdaterArtifacts 无法签名"
            exit 1
          fi
          if [[ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]]; then
            echo "::error::缺少 Secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Update Tauri Icons from SVG
        working-directory: app
        run: npx tauri icon public/logo.svg

      - name: Prepare unified package branding
        run: node scripts/prepare-lang.mjs unified

      - name: Verify prepared branding
        run: node scripts/check-release-invariants.mjs --prepared unified

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ice-juice/git-keymaster-app
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          owner: ice-juice
          repo: git-keymaster-app
          args: ${{ matrix.args }}
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Git Keymaster ${{ steps.meta.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          releaseCommitish: release
          includeUpdaterJson: ${{ steps.meta.outputs.publish == 'true' }}
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          retryAttempts: 3

      - name: Require installer bundles
        shell: bash
        run: node scripts/sync-release-assets.mjs --require-bundles

      - name: Normalize installer names
        shell: bash
        run: node scripts/rename-release-assets.mjs

      - name: Sync renamed assets to GitHub Release
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sync-release-assets.mjs "${{ steps.meta.outputs.tag }}"

      - name: Upload installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/**
            app/src-tauri/target/universal-apple-darwin/release/bundle/**

  pin-updater-json:
    name: pin latest.json
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Copy latest.json to legacy locale aliases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          command -v gh
          gh release view "${GITHUB_REF_NAME}" --repo ice-juice/git-keymaster-app
          node scripts/sync-release-assets.mjs --pin-legacy "${GITHUB_REF_NAME}"

  build-android:
    name: android
    needs: preflight
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            echo "Building from release branch"
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git fetch origin release --depth=100
            if git merge-base --is-ancestor HEAD origin/release; then
              echo "Tag ${GITHUB_REF_NAME} is on release"
              exit 0
            fi
            echo "::error::v* 标签必须打在 release 分支的提交上"
            exit 1
          fi
          echo "::error::打包与发布只允许在 release 分支，或基于该分支的 v* 标签上执行"
          exit 1

      - name: Decide release mode
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.create_release }}" == "true" ]]; then
            publish=true
            tag="v__VERSION__"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          prefix-key: android-aarch64

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?runner 缺少 ANDROID_HOME}"
          : "${ANDROID_NDK_HOME:?runner 缺少 ANDROID_NDK_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          test -d "$ANDROID_NDK_HOME"
          sdk_bin=""
          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdk_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          else
            sdk_bin="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)")"
          fi
          echo "$sdk_bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Require Android signing secrets
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: node scripts/setup-android-signing.mjs

      - name: Require updater signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]]; then
            echo "::error::缺少 Secrets.TAURI_SIGNING_PRIVATE_KEY，无法给 APK / latest.json 做 minisign"
            exit 1
          fi
          if [[ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]]; then
            echo "::error::缺少 Secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Update Tauri Icons from SVG
        working-directory: app
        run: npx tauri icon public/logo.svg

      - name: Prepare unified package branding
        run: node scripts/prepare-lang.mjs unified

      - name: Verify prepared branding
        run: node scripts/check-release-invariants.mjs --prepared unified

      - name: Build signed Android APK
        working-directory: app
        run: npx tauri android build --apk --target aarch64 --split-per-abi

      - name: Normalize Android APK name
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/rename-release-assets.mjs --android

      - name: Upload Android APK to GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if [[ -z "$tag" || "$tag" == "v__VERSION__" ]]; then
            echo "skip Android release upload (no real tag)"
            exit 0
          fi
          mapfile -t apks < <(ls app/src-tauri/gen/android/app/build/outputs/apk/arm64/release/Git.Keymaster_*_arm64-v8a.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::期望刚好 1 个改名后的 APK，实际是 ${#apks[@]}"
            exit 1
          fi
          if [[ ! -f "${apks[0]}.sig" ]]; then
            echo "::error::缺少对应的 .apk.sig，安卓包必须先做 minisign"
            exit 1
          fi
          if ! gh release view "$tag" --repo ice-juice/git-keymaster-app >/dev/null 2>&1; then
            version="${tag#v}"
            notes="$(bash scripts/build-release-notes.sh "$version")"
            gh release create "$tag" --draft --title "Git Keymaster $tag" --notes "$notes" --target release --repo ice-juice/git-keymaster-app
          fi
          gh release upload "$tag" "${apks[0]}" "${apks[0]}.sig" --clobber --repo ice-juice/git-keymaster-app

      - name: Merge Android APK into latest.json
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sync-release-assets.mjs --merge-android "${{ steps.meta.outputs.tag }}"

      - name: Upload Android APK artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/arm64/release/Git.Keymaster_*_arm64-v8a.apk
